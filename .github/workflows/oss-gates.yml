# Open-source hygiene gates. Deliberately a separate workflow from ci.yml: these
# answer "is this repository safe to publish and contribute to?", not "does the
# code build and pass?", and keeping them apart keeps the required-checks list
# legible when a gate fails.
name: OSS Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: oss-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans all of history, not the diff: this repository is public, so a secret
  # added and removed inside one pull request is already exposed once published.
  # Anything found here needs rotating, not scrubbing.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # --log-opts=--all walks every ref; the default shallow clone would
          # leave the gate scanning a single commit and passing vacuously.
          fetch-depth: 0

      # The binary, not gitleaks/gitleaks-action: that action requires a paid
      # GITLEAKS_LICENSE secret for organisation-owned repositories and fails the
      # job outright without one. The scanner itself is MIT and ungated.
      #
      # Dependabot only watches github-actions (.github/dependabot.yml), so this
      # version is not updated automatically — bump it by hand.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      # Reads .gitleaks.toml, which allowlists reserved documentation domains by
      # content rather than by path — a real credential in a test file still
      # fails this step.
      - name: scan history for secrets
        run: /tmp/gitleaks git . --log-opts="--all" --redact --verbose

  # govulncheck rather than a generic scanner: it reports only vulnerabilities
  # that are actually reachable from this module's call graph, so a CVE in an
  # unused corner of a dependency does not block a pull request that cannot
  # trigger it.
  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # PRs are squash-merged, so the PR *title* becomes the subject on main. This
  # checks the branch's commits; the title is enforced by the merge queue's own
  # settings. Only runs on pull_request — a push to main has no base..head range
  # to diff, and branch protection blocks direct pushes anyway.
  commit-style:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Commit subjects are attacker-controlled text: a pull request from a fork
      # can put $(...), backticks or a semicolon in one. They are therefore
      # written to a file and read back as data — never interpolated into this
      # script — and the two SHAs arrive through env rather than inline ${{ }},
      # which would splice them into the shell source before it runs.
      - name: check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Merge commits are excluded: the Conventional Commits spec does not
          # cover them, and their subjects are generated by GitHub.
          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > /tmp/subjects.txt

          pattern='^(feat|fix|docs|chore|test|refactor|perf|build|ci|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          failed=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if printf '%s' "$subject" | grep -qE "$pattern"; then
              printf 'ok   %s\n' "$subject"
            else
              printf 'FAIL %s\n' "$subject"
              failed=1
            fi
          done < /tmp/subjects.txt

          if [ "$failed" -ne 0 ]; then
            echo "::error::Commit subjects must follow Conventional Commits (see CONTRIBUTING.md)"
            exit 1
          fi
