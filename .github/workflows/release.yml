# Builds the four wake binaries on a `v*` tag and publishes them, with checksums.txt,
# as a GitHub Release. install.sh and the APM package template download from it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag that does not match the crate version would publish binaries whose
  # `wake --version` disagrees with the release name.
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: compare the tag with the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "${TAG#v}" != "$crate" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${crate}"
            exit 1
          fi
          echo "tag ${TAG} matches Cargo.toml version ${crate}"

  build:
    name: build (${{ matrix.asset }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: static musl binaries, cross-compiled with cargo-zigbuild.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: wake-linux-x64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: wake-linux-arm64, zig: true }
          # macOS: built natively on a macOS runner, which has the SDK.
          - { os: macos-latest, target: x86_64-apple-darwin, asset: wake-darwin-x64, zig: false }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: wake-darwin-arm64, zig: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: add the target
        run: rustup target add "${{ matrix.target }}"

      # zig comes from PyPI's `ziglang` rather than a third-party action.
      - name: install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          set -euo pipefail
          python3 -m pip install ziglang==0.17.1
          cargo install --locked --version 0.24.1 cargo-zigbuild

      - name: build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}"

      - name: build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: name the asset and check its size
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/wake" "${{ matrix.asset }}"
          size="$(wc -c < "${{ matrix.asset }}" | tr -d ' ')"
          echo "${{ matrix.asset }} is ${size} bytes"
          if [ "$size" -gt 2097152 ]; then
            echo "::error::${{ matrix.asset }} is ${size} bytes, over the 2097152 byte limit"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: write checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(ls | wc -l)" -eq 4
          sha256sum wake-darwin-arm64 wake-darwin-x64 wake-linux-arm64 wake-linux-x64 > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/wake-darwin-arm64
            dist/wake-darwin-x64
            dist/wake-linux-arm64
            dist/wake-linux-x64
            dist/checksums.txt
          generate_release_notes: true
