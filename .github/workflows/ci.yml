name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: launcher and install script
        run: |
          sh tests/launcher.sh
          shellcheck install.sh package/bin/wake tests/launcher.sh

      - name: perf budget (release mode)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test perf -- --ignored

      - name: release binary is at most 2 MB
        run: |
          set -euo pipefail
          cargo build --release
          size="$(wc -c < target/release/wake | tr -d ' ')"
          echo "wake is ${size} bytes"
          if [ "$size" -gt 2097152 ]; then
            echo "::error::release binary is ${size} bytes, over the 2097152 byte limit"
            exit 1
          fi
