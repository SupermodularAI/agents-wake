name: CI

on:
  # Only main on push. Branch pushes are already covered by `pull_request`, and
  # matching "**" here runs every job twice per commit — the concurrency group
  # below cannot dedupe them because github.ref differs between the two events
  # (refs/heads/<branch> vs refs/pull/<n>/merge).
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one, so the release gate is exactly the CI
  # gate: one build matrix (ADR-0021), never a second one that can drift from it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and linting are toolchain-independent, so they run once rather
  # than per Go version. golangci-lint comes from go.tools.mod via `go tool`, so
  # its version is pinned in one place and CI runs exactly what `make lint` runs.
  lint:
    name: fmt · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true
          # Without go.tools.sum in the key, the cache misses every run and
          # golangci-lint is rebuilt from ~230 modules each time.
          cache-dependency-path: |
            go.sum
            go.tools.sum

      - name: gofmt · goimports
        run: make fmt-check

      - name: golangci-lint
        run: make lint

  test:
    # "1.25.x" MUST match the go directive in go.mod: it is the floor we promise,
    # and testing only `stable` would make that promise unverified. "stable"
    # tracks the current release automatically, so this matrix does not rot.
    name: vet · test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      # The release gate requires a race-clean suite. Once, on the current
      # toolchain: the floor is what the matrix above proves.
      - name: go test -race
        if: matrix.go == 'stable'
        run: make test-race

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `git describe` needs tags to produce a real version.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Release artifacts are built with the current toolchain; the floor is
          # what `test` above verifies.
          go-version: stable
          cache: true

      # Cross-compiled from one runner because the binary is static and cgo-free
      # (ADR-0001) — there is nothing platform-specific to link against, so a
      # matrix of real macOS runners would buy nothing. GOOS/GOARCH are read by
      # `go build` inside the Makefile, so this is the same command devs run.
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      # Read from the embedded build info rather than the symbol table: the build
      # strips symbols (-s -w), so a `go tool nm | grep _cgo_` check would find
      # nothing on any binary and silently pass forever. Build info survives
      # stripping and reports CGO_ENABLED as it was actually set.
      - name: confirm the binary is cgo-free
        run: |
          go version -m dist/wake | grep -E '^\s+build\s+(CGO_ENABLED|GOOS|GOARCH)='
          if ! go version -m dist/wake | grep -qE '^\s+build\s+CGO_ENABLED=0$'; then
            echo "::error::CGO_ENABLED is not 0 — the binary is not the static artifact ADR-0001 promises"
            exit 1
          fi

      # CI artifacts are ephemeral and dev-stamped, and are never attached to a
      # Release: public release assets come only from GoReleaser in release.yml.
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wake-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wake
          if-no-files-found: error
          retention-days: 7

  # A config check, not a second build matrix: the platform set in
  # .goreleaser.yaml is asserted equal to this file's by
  # internal/platform/matrix_test.go. Without this job, .goreleaser.yaml and
  # release.yml would first be exercised by a tag push.
  release-config:
    name: goreleaser check · snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true
      # GoReleaser shells out to syft for the per-archive SBOM.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: check

      # A snapshot proves the config produces the artifacts, publishing nothing.
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      # The ldflags templates are asserted on the artifact, not trusted from the
      # config: a snapshot has no tag, so tag/commit/date is checked at tag time
      # in release.yml, and commit/date here, on every pull request.
      - name: confirm the snapshot artifact carries version metadata
        run: |
          binary="$(find dist -type f -name wake -path '*linux_amd64*' | head -n 1)"
          test -n "$binary" || { echo "::error::no linux/amd64 binary in dist"; exit 1; }
          version="$("$binary" --version)"
          echo "$version"
          echo "$version" | grep -qE 'commit [0-9a-f]{7,}' || { echo "::error::--version does not name the commit"; exit 1; }
          echo "$version" | grep -qE 'built [0-9]{4}-[0-9]{2}-[0-9]{2}T' || { echo "::error::--version does not name the build date"; exit 1; }
