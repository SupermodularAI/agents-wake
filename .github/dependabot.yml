# Pins are only trustworthy if something moves them. Dependabot rewrites the SHA
# and its version comment together, so a pinned action still receives security
# fixes. Cargo dependencies are few; weekly updates keep them reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
