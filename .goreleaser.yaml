# Release configuration. ADR-0001 releases with GoReleaser; ADR-0021 fixes the
# platform set at darwin/linux x amd64/arm64 — the same set CI's build job
# builds. internal/platform/matrix_test.go asserts this file against that set, so
# a platform CI never tested cannot appear here quietly.
#
# No build tags: release artefacts ship without `remote`, because the promise is
# that the binary you installed contains no network code (ADR-0012).
version: 2

project_name: wake

before:
  hooks:
    - go mod download

builds:
  - id: wake
    main: ./cmd/wake
    binary: wake
    # Static and cgo-free, like `make build` and CI's build job (ADR-0001).
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The same three symbols the Makefile injects, so an official artefact
    # reports its tag, commit and date instead of dev/none/unknown.
    ldflags:
      - -s -w
      - -X github.com/SupermodularAI/agents-wake/internal/version.Version={{ .Tag }}
      - -X github.com/SupermodularAI/agents-wake/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/SupermodularAI/agents-wake/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]

# tar.gz (the default) and nothing else: a release places a binary and touches
# nothing on the machine that unpacks it.
archives:
  - id: wake
    name_template: "wake_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  algorithm: sha256
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

release:
  draft: false
  prerelease: auto
